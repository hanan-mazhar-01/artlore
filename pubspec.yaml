name: artlore
description: "ArtLore — a private museum companion. Scan, discover and look closer at the world's great artworks."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.13.1

dependencies:
  camera: ^0.12.1
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_sign_in: ^6.2.2
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.1
  photo_manager: ^3.12.0
  purchases_flutter: ^10.14.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/artworks/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        # Variable font: Flutter drives the wght axis from FontWeight.
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
